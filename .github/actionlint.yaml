self-hosted-runner:
  labels:
    - oracle-vm-16cpu-64gb-x86-64
    - 1ES.Pool=1es-aks-fleet-pool-ubuntu
    - 1ES.Pool=1es-aks-fleet-pool-ubuntu-arm64

paths:
  # The squad-* workflows and sync-squad-labels.yml are generated by the `squad`
  # CLI and are overwritten wholesale by `squad upgrade`, so any lint fix applied
  # here is silently reverted on the next upgrade. Exclude them from actionlint
  # and shellcheck; issues are tracked upstream instead:
  # https://github.com/bradygaster/squad/issues/1556
  .github/workflows/squad-*.{yml,yaml}:
    ignore:
      - '.*'
  .github/workflows/sync-squad-labels.{yml,yaml}:
    ignore:
      - '.*'
