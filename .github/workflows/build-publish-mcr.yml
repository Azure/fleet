# This Github Action packages the ARC member cluster agents Helm chart and publishes it to Azure Container
# Registry (ACR), from where it is automatically pushed to the trusted registry, Microsoft Container Registry (MCR).

# The agent images are built and published by a separate pipeline; this workflow only resolves their
# already-published tags.

name: Building and Pushing to MCR
on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag of the Azure/fleet images, defaults to the latest one'
        type: string
      fleetNetworkingReleaseTag:
        description: 'Release tag of the Azure/fleet-networking images, defaults to the latest one'
        type: string

permissions:
  id-token: write
  contents: read

env:
  # `public` indicates images to MCR will be publicly available, and will be removed in the final MCR images
  ARC_REGISTRY_REPO: public/microsoft.fleetmember
  # The MCR registry API omits the `public` prefix that the ACR push path carries.
  MCR_FLEET_REPO: aks/v2/fleet

jobs:
  prepare-variables:
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.vars.outputs.git_ref }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      fleet_networking_version: ${{ steps.vars.outputs.fleet_networking_version }}
      arc_helmchart_version: ${{ steps.vars.outputs.arc_helmchart_version }}
    steps:
      - name: 'Set output variables'
        id: vars
        run: |
          set -euo pipefail

          # Images are published to MCR as <release tag>-<revision>; the revision is bumped on every rebuild
          # of the same source, so the highest one is current.
          resolve_mcr_tag() {
            local repo="$1" base="$2" tags revision
            tags=$(curl -sf --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
              "https://mcr.microsoft.com/v2/${repo}/tags/list" | jq -r '.tags[]?')
            if [ -z "$tags" ]; then
              echo "Failed to list tags for ${repo}." >&2
              return 1
            fi
            revision=$(echo "$tags" | grep -E "^${base}-[0-9]+$" | sed "s/^${base}-//" | sort -n | tail -1)
            if [ -z "$revision" ]; then
              echo "No published revision of ${base} found in ${repo}; available tags:" >&2
              echo "$tags" >&2
              return 1
            fi
            echo "${base}-${revision}"
          }

          # Release tags are read from the upstream repositories rather than the checkout, which on a fork
          # carries no tags.
          latest_github_tag() {
            local repo="$1" tag
            tag=$(curl -sf --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
              "https://api.github.com/repos/${repo}/tags" | jq -r '.[0].name // empty')
            if [ -z "$tag" ]; then
              echo "Failed to resolve the latest tag of ${repo}." >&2
              return 1
            fi
            echo "$tag"
          }

          FLEET_RELEASE_TAG="${{ inputs.releaseTag }}"
          if [ -z "$FLEET_RELEASE_TAG" ]; then
            FLEET_RELEASE_TAG=$(latest_github_tag "Azure/fleet")
            echo "The user input release tag is empty, will use the latest tag $FLEET_RELEASE_TAG."
          fi

          FLEET_NETWORKING_RELEASE_TAG="${{ inputs.fleetNetworkingReleaseTag }}"
          if [ -z "$FLEET_NETWORKING_RELEASE_TAG" ]; then
            FLEET_NETWORKING_RELEASE_TAG=$(latest_github_tag "Azure/fleet-networking")
            echo "The user input fleet-networking release tag is empty, will use the latest tag $FLEET_NETWORKING_RELEASE_TAG."
          fi

          # Member agent, refresh token and CRD installer share a revision, so one lookup tags all three.
          RELEASE_TAG=$(resolve_mcr_tag "${{ env.MCR_FLEET_REPO }}/member-agent" "$FLEET_RELEASE_TAG")
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using fleet image tag: $RELEASE_TAG"

          # The revision suffix has no matching git tag, so checkout uses the plain release tag.
          echo "git_ref=$FLEET_RELEASE_TAG" >> "$GITHUB_OUTPUT"

          FLEET_NETWORKING_VERSION=$(resolve_mcr_tag "${{ env.MCR_FLEET_REPO }}/mcs-controller-manager" "$FLEET_NETWORKING_RELEASE_TAG")
          echo "fleet_networking_version=$FLEET_NETWORKING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using fleet-networking image tag: $FLEET_NETWORKING_VERSION"

          # Helm chart versions must be valid semver, which disallows the leading 'v'.
          ARC_HELMCHART_VERSION="${RELEASE_TAG#v}"
          echo "arc_helmchart_version=$ARC_HELMCHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Arc Helm Chart version: $ARC_HELMCHART_VERSION"

  publish-arc-helm-chart:
    runs-on:
      labels: [self-hosted, "1ES.Pool=1es-aks-fleet-pool-ubuntu"]
    needs: prepare-variables
    env:
      MEMBER_AGENT_IMAGE_VERSION: ${{ needs.prepare-variables.outputs.release_tag }}
      REFRESH_TOKEN_IMAGE_VERSION: ${{ needs.prepare-variables.outputs.release_tag }}
      CRD_INSTALLER_IMAGE_VERSION: ${{ needs.prepare-variables.outputs.release_tag }}
      MCS_CONTROLLER_IMAGE_VERSION: ${{ needs.prepare-variables.outputs.fleet_networking_version }}
      MEMBER_NET_CONTROLLER_IMAGE_VERSION: ${{ needs.prepare-variables.outputs.fleet_networking_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-variables.outputs.git_ref }}
      # Compatibility for release tags whose chart still uses the legacy MCR prefix.
      # Keep while publishing new image revisions from those tags is supported.
      - name: Update legacy chart image repositories
        run: sed -i "s|^\([[:space:]]*repository:[[:space:]]*\)mcr\.microsoft\.com/aks/fleet/|\1mcr.microsoft.com/${MCR_FLEET_REPO}/|" charts/member-agent-arc/values.yaml
      - name: Verify every chart image is published
        run: |
          set -euo pipefail
          envsubst < charts/member-agent-arc/values.yaml > "$RUNNER_TEMP/values.yaml"
          images=$(helm template charts/member-agent-arc -f "$RUNNER_TEMP/values.yaml" \
            | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' | sort -u)
          if [ -z "$images" ]; then
            echo "The rendered chart references no images." >&2
            exit 1
          fi
          missing=0
          for image in $images; do
            ref="${image#mcr.microsoft.com/}"
            if [ "$ref" = "$image" ]; then
              echo "Image is not hosted on MCR: ${image}" >&2
              missing=1
              continue
            fi
            # The self-hosted runner's curl predates --retry-all-errors.
            status=$(curl -s -o /dev/null -w '%{http_code}' -I --retry 3 --retry-delay 5 --max-time 30 \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://mcr.microsoft.com/v2/${ref%:*}/manifests/${ref##*:}") || true
            if [ "$status" = "200" ]; then
              echo "Found ${image}"
            else
              echo "Image not found in MCR (HTTP ${status:-none}): ${image}" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: 'Login the ACR'
        run: |
          az login --identity
          az acr login -n ${{ secrets.AZURE_REGISTRY }}
      # Arc Extensions require all components bundled in one chart, hence the member agent and the
      # networking agents are packaged together here.
      - name: Build and publish ARC member cluster agents helm chart
        run: |
          make helm-package-arc-member-cluster-agents
        env:
          ARC_MEMBER_AGENT_HELMCHART_VERSION: ${{ needs.prepare-variables.outputs.arc_helmchart_version }}
          REGISTRY: ${{ secrets.AZURE_REGISTRY }}/${{ env.ARC_REGISTRY_REPO}}
