name: Setup Release

on:
    workflow_call:
        inputs:
            tag:
                description: "Release tag (e.g., v1.0.0)"
                required: true
                type: string
        outputs:
            registry:
                description: "OCI registry repository path (e.g., ghcr.io/org/repo)"
                value: ${{ jobs.export.outputs.registry }}
            tag:
                description: "Release tag (e.g., v1.0.0)"
                value: ${{ jobs.export.outputs.tag }}
            version:
                description: "Release version without v prefix (e.g., 1.0.0)"
                value: ${{ jobs.export.outputs.version }}
            prerelease:
                description: "\"true\" when the tag is a pre-release (e.g., v1.0.0-rc.1), \"false\" otherwise"
                value: ${{ jobs.export.outputs.prerelease }}

env:
    REGISTRY: ghcr.io

jobs:
    export:
        runs-on: ubuntu-latest
        # Validates an input and writes step outputs; it touches no GitHub API,
        # so it needs no token. Without this it inherits the caller's
        # permissions, and chart.yml calls it with contents/packages write.
        permissions: {}
        outputs:
            registry: ${{ steps.setup.outputs.registry }}
            tag: ${{ steps.setup.outputs.tag }}
            version: ${{ steps.setup.outputs.version }}
            prerelease: ${{ steps.setup.outputs.prerelease }}
        steps:
            - id: setup
              # The tag arrives as an environment variable rather than being
              # interpolated into the script body: `TAG="${{ inputs.tag }}"`
              # expands the value in the shell before the validation below can
              # reject it. Both callers are affected, not just the
              # workflow_dispatch input - backticks and $(...) are legal in git
              # ref names and still match the v*.*.* push filter. Reaching
              # either needs repository write access, so this is defence in
              # depth, but the outputs below are interpolated into shell by
              # every downstream job, which makes the regex the trust boundary
              # for all of them.
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  TAG="${RELEASE_TAG}"
                  if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                    echo "Error: Invalid release tag '${TAG}'. Expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
                    exit 1
                  fi

                  # The regex above admits exactly one pre-release form, so the
                  # suffix test is a complete classification. Callers gate on
                  # this single output instead of re-deriving "is this an RC?"
                  # in every consuming job.
                  PRERELEASE=false
                  case "${TAG}" in *-rc.*) PRERELEASE=true ;; esac

                  # registry must be in lowercase
                  {
                    echo "registry=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
                    echo "tag=${TAG}"
                    echo "version=${TAG#v}"
                    echo "prerelease=${PRERELEASE}"
                  } >> "$GITHUB_OUTPUT"
                  echo "Release tag: ${TAG}, version: ${TAG#v}, prerelease: ${PRERELEASE}"
