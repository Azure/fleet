{{- $useSidecar := and (not .Values.useCAAuth) (not .Values.useKubeconfig) }}
{{- $mountIdentitySecret := and .Values.useCAAuth .Values.config.identitySecretName }}
{{- $mountHubKubeconfig := and (not .Values.useCAAuth) .Values.useKubeconfig }}
{{- if and .Values.useCAAuth .Values.useKubeconfig }}
{{- fail "useCAAuth and useKubeconfig must not both be true: with both set, useCAAuth silently wins (only --use-ca-auth is passed to the member agent) and the requested kubeconfig mode is never applied. Set exactly one." }}
{{- end }}
{{- if and .Values.useKubeconfig (not .Values.config.hubKubeconfigSecretName) }}
{{- fail "config.hubKubeconfigSecretName must be set when useKubeconfig is true (it names the Secret, key \"kubeconfig\", to mount as the hub kubeconfig)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "member-agent.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "member-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "member-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "member-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "member-agent.fullname" . }}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if .Values.crdInstaller.enabled }}
        - name: crd-installer
          image: "{{ .Values.crdInstaller.image.repository }}:{{ .Values.crdInstaller.image.tag }}"
          imagePullPolicy: {{ .Values.crdInstaller.image.pullPolicy }}
          args:
            - --mode=member
            - --v={{ .Values.crdInstaller.logVerbosity }}
        {{- end }}
      containers:
        - name: {{ include "member-agent.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
          args:
            - --leader-elect=true
            {{- if .Values.useCAAuth }}
            - --use-ca-auth={{ .Values.useCAAuth }}
            {{- else if $mountHubKubeconfig }}
            - --use-kubeconfig=true
            {{- else }}
            - --tls-insecure={{ .Values.tlsClientInsecure }}
            {{- end }}
            - --v={{ .Values.logVerbosity }}
            - -add_dir_header
            - --enable-pprof={{ .Values.enablePprof }}
            - --pprof-port={{ .Values.pprofPort }}
            - --hub-pprof-port={{ .Values.hubPprofPort }}
            {{- if .Values.workApplierRequeueRateLimiterAttemptsWithFixedDelay }}
            - --work-applier-requeue-rate-limiter-attempts-with-fixed-delay={{ .Values.workApplierRequeueRateLimiterAttemptsWithFixedDelay }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterFixedDelaySeconds }}
            - --work-applier-requeue-rate-limiter-fixed-delay-seconds={{ .Values.workApplierRequeueRateLimiterFixedDelaySeconds }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterExponentialBaseForSlowBackoff }}
            - --work-applier-requeue-rate-limiter-exponential-base-for-slow-backoff={{ .Values.workApplierRequeueRateLimiterExponentialBaseForSlowBackoff }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterInitialSlowBackoffDelaySeconds }}
            - --work-applier-requeue-rate-limiter-initial-slow-backoff-delay-seconds={{ .Values.workApplierRequeueRateLimiterInitialSlowBackoffDelaySeconds }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterMaxSlowBackoffDelaySeconds }}
            - --work-applier-requeue-rate-limiter-max-slow-backoff-delay-seconds={{ .Values.workApplierRequeueRateLimiterMaxSlowBackoffDelaySeconds }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterExponentialBaseForFastBackoff }}
            - --work-applier-requeue-rate-limiter-exponential-base-for-fast-backoff={{ .Values.workApplierRequeueRateLimiterExponentialBaseForFastBackoff }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterMaxFastBackoffDelaySeconds }}
            - --work-applier-requeue-rate-limiter-max-fast-backoff-delay-seconds={{ .Values.workApplierRequeueRateLimiterMaxFastBackoffDelaySeconds }}
            {{- end }}
            {{- if .Values.workApplierRequeueRateLimiterSkipToFastBackoffForAvailableOrDiffReportedWorkObjs }}
            - --work-applier-requeue-rate-limiter-skip-to-fast-backoff-for-available-or-diff-reported-work-objs={{ .Values.workApplierRequeueRateLimiterSkipToFastBackoffForAvailableOrDiffReportedWorkObjs }}
            {{- end }}
            {{- if .Values.propertyProvider }}
            - --property-provider={{ .Values.propertyProvider }}
            {{- end }}
            {{- if eq .Values.propertyProvider "azure" }}
            - --cloud-config=/etc/kubernetes/provider/config.json
            {{- end }}
            {{- if .Values.region }}
            - --region={{ .Values.region }}
            {{- end }}
            {{- if .Values.priorityQueue.enabled }}
            - --enable-work-applier-priority-queue=true
            - --work-applier-priority-linear-equation-coeff-a={{ .Values.priorityQueue.priorityLinearEquationCoeffA }}
            - --work-applier-priority-linear-equation-coeff-b={{ .Values.priorityQueue.priorityLinearEquationCoeffB }}
            {{- end }}
            {{- if .Values.enableNamespaceCollectionInPropertyProvider }}
            - --enable-namespace-collection-in-property-provider={{ .Values.enableNamespaceCollectionInPropertyProvider }}
            {{- end }}
          env:
          {{- if not $mountHubKubeconfig }}
          - name: HUB_SERVER_URL
            value: "{{ .Values.config.hubURL }}"
          {{- end }}
          {{- if $mountHubKubeconfig }}
          - name: KUBE_CONFIG_PATH
            value: "/etc/kubefleet/hub-kubeconfig/kubeconfig"
          {{- end }}
          {{- if $useSidecar }}
          - name: CONFIG_PATH
            value: "/config/token"
          {{- end }}
          - name: MEMBER_CLUSTER_NAME
            value: "{{ .Values.config.memberClusterName }}"
          {{- if not $mountHubKubeconfig }}
          - name: HUB_CERTIFICATE_AUTHORITY
            value: "{{ .Values.config.hubCA }}"
          {{- end }}
          {{- if .Values.useCAAuth }}
          - name: IDENTITY_KEY
            value:  "{{ if .Values.config.identitySecretName }}/etc/kubefleet/hub-identity/tls.key{{ else }}{{ .Values.config.identityKey }}{{ end }}"
          - name: IDENTITY_CERT
            value:  "{{ if .Values.config.identitySecretName }}/etc/kubefleet/hub-identity/tls.crt{{ else }}{{ .Values.config.identityCert }}{{ end }}"
          - name: CA_BUNDLE
            value:  "{{ .Values.config.CABundle }}"
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: 8080
              name: hubmetrics
              protocol: TCP
            - containerPort: 8081
              name: hubhealthz
              protocol: TCP
            - containerPort: 8090
              name: membermetrics
              protocol: TCP
            - containerPort: 8091
              name: memberhealthz
              protocol: TCP
            {{- if .Values.enablePprof }}
            - containerPort: {{ .Values.pprofPort }}
              name: memberpprof
              protocol: TCP
            - containerPort: {{ .Values.hubPprofPort }}
              name: hubpprof
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: hubhealthz
          readinessProbe:
            httpGet:
              path: /readyz
              port: hubhealthz
        {{- if or ($useSidecar) (eq .Values.propertyProvider "azure") ($mountIdentitySecret) ($mountHubKubeconfig) (.Values.extraVolumeMounts) }}
          volumeMounts:
          {{- if $useSidecar }}
          - name: provider-token
            mountPath: /config
          {{- end }}
          {{- if eq .Values.propertyProvider "azure" }}
          - name: cloud-provider-config
            mountPath: /etc/kubernetes/provider
            readOnly: true
          {{- end }}
          {{- if $mountIdentitySecret }}
          - name: hub-identity
            mountPath: /etc/kubefleet/hub-identity
            readOnly: true
          {{- end }}
          {{- if $mountHubKubeconfig }}
          - name: hub-kubeconfig
            mountPath: /etc/kubefleet/hub-kubeconfig
            readOnly: true
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- if $useSidecar }}
        - name: refresh-token
          image: "{{ .Values.refreshtoken.repository }}:{{ .Values.refreshtoken.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.refreshtoken.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            {{- $provider := .Values.config.provider }}
            - {{ $provider }}
            {{- range $key, $value := (index .Values $provider) }}
            - --{{ $key }}={{ $value }}
            {{- end }}
            - --v={{ .Values.logVerbosity }}
          ports:
            - name: http
              containerPort: 4000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          - name: provider-token
            mountPath: /config
        {{- end }}
      {{- if .Values.extraInitContainers }}
      initContainers:
        {{- toYaml .Values.extraInitContainers | nindent 8 }}
      {{- end }}
      {{- if or ($useSidecar) (eq .Values.propertyProvider "azure") ($mountIdentitySecret) ($mountHubKubeconfig) (.Values.extraVolumes) }}
      volumes:
      {{- if $useSidecar }}
      - name: provider-token
        emptyDir: {}
      {{- end }}
      {{- if eq .Values.propertyProvider "azure" }}
      - name: cloud-provider-config
        secret:
          secretName: cloud-config
      {{- end }}
      {{- if $mountIdentitySecret }}
      - name: hub-identity
        secret:
          secretName: {{ .Values.config.identitySecretName }}
      {{- end }}
      {{- if $mountHubKubeconfig }}
      - name: hub-kubeconfig
        secret:
          secretName: {{ .Values.config.hubKubeconfigSecretName }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
