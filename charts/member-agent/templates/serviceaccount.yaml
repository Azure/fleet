apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "member-agent.fullname" . }}-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "member-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
