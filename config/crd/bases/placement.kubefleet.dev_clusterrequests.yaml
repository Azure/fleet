---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusterrequests.placement.kubefleet.dev
spec:
  group: placement.kubefleet.dev
  names:
    categories:
    - kubefleet
    - kubefleet-placement
    kind: ClusterRequest
    listKind: ClusterRequestList
    plural: clusterrequests
    singular: clusterrequest
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterRequest is a KubeFleet API that represents a request for a member cluster to be provisioned.
          It is created by KubeFleet when it fails to find a member cluster that can fulfill some scheduling
          requirements as specified in a PlacementPolicy or ClusterPlacementPolicy object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: The specification of the cluster request.
            properties:
              clusterSelectorTerms:
                description: |-
                  The cluster selector terms that describe the requirements for a new member cluster.

                  If not specified, any member cluster can satisfy the request.

                  This field is immutable after creation.
                items:
                  properties:
                    matchClusterPropertyExpressions:
                      description: A list of cluster property expressions that a cluster
                        must all satisfy to match this selector term.
                      items:
                        properties:
                          key:
                            description: The key of the label or cluster property
                              that selector applies to.
                            type: string
                          operator:
                            description: |-
                              The operator that specifies the relationship between the current value under the key and the given values.

                              If the operation is In, NotIn, Exists, or DoesNotExist, the key must be one referring to a label, or to a string-based
                              cluster property.
                              If the operation is Gt, Lt, Ge, Le, Eq, or Ne, the key must be one referring to a numeric-based cluster property.
                              Applying an unsupported operator to a key will cause an error at the scheduling phase.
                            enum:
                            - In
                            - NotIn
                            - Exists
                            - DoesNotExist
                            - Gt
                            - Lt
                            - Ge
                            - Le
                            - Eq
                            - Ne
                            type: string
                          values:
                            description: |-
                              The values that are used in conjunction with the operator to determine if a selector matches.

                              If the operator is In or NotIn, the values array must be non-empty.
                              If the operator is Exists or DoesNotExist, the values array must be empty.
                              If the operator is Gt, Lt, Ge, Le, Eq, or Ne, the values array must contain exactly one element.
                            items:
                              type: string
                            type: array
                        required:
                        - key
                        - operator
                        type: object
                        x-kubernetes-validations:
                        - message: values must be non-empty when operator is In or
                            NotIn
                          rule: '(self.operator == ''In'' || self.operator == ''NotIn'')
                            ? (has(self.values) && size(self.values) > 0) : true'
                        - message: values must be empty when operator is Exists or
                            DoesNotExist
                          rule: '(self.operator == ''Exists'' || self.operator ==
                            ''DoesNotExist'') ? (!has(self.values) || size(self.values)
                            == 0) : true'
                        - message: values must contain exactly one element when operator
                            is Gt, Lt, Ge, Le, Eq, or Ne
                          rule: '(self.operator == ''Gt'' || self.operator == ''Lt''
                            || self.operator == ''Ge'' || self.operator == ''Le''
                            || self.operator == ''Eq'' || self.operator == ''Ne'')
                            ? (has(self.values) && size(self.values) == 1) : true'
                      maxItems: 10
                      type: array
                    matchLabelExpressions:
                      description: A list of label expressions that a cluster must
                        all satisfy to match this selector term.
                      items:
                        properties:
                          key:
                            description: The key of the label or cluster property
                              that selector applies to.
                            type: string
                          operator:
                            description: |-
                              The operator that specifies the relationship between the current value under the key and the given values.

                              If the operation is In, NotIn, Exists, or DoesNotExist, the key must be one referring to a label, or to a string-based
                              cluster property.
                              If the operation is Gt, Lt, Ge, Le, Eq, or Ne, the key must be one referring to a numeric-based cluster property.
                              Applying an unsupported operator to a key will cause an error at the scheduling phase.
                            enum:
                            - In
                            - NotIn
                            - Exists
                            - DoesNotExist
                            - Gt
                            - Lt
                            - Ge
                            - Le
                            - Eq
                            - Ne
                            type: string
                          values:
                            description: |-
                              The values that are used in conjunction with the operator to determine if a selector matches.

                              If the operator is In or NotIn, the values array must be non-empty.
                              If the operator is Exists or DoesNotExist, the values array must be empty.
                              If the operator is Gt, Lt, Ge, Le, Eq, or Ne, the values array must contain exactly one element.
                            items:
                              type: string
                            type: array
                        required:
                        - key
                        - operator
                        type: object
                        x-kubernetes-validations:
                        - message: values must be non-empty when operator is In or
                            NotIn
                          rule: '(self.operator == ''In'' || self.operator == ''NotIn'')
                            ? (has(self.values) && size(self.values) > 0) : true'
                        - message: values must be empty when operator is Exists or
                            DoesNotExist
                          rule: '(self.operator == ''Exists'' || self.operator ==
                            ''DoesNotExist'') ? (!has(self.values) || size(self.values)
                            == 0) : true'
                        - message: values must contain exactly one element when operator
                            is Gt, Lt, Ge, Le, Eq, or Ne
                          rule: '(self.operator == ''Gt'' || self.operator == ''Lt''
                            || self.operator == ''Ge'' || self.operator == ''Le''
                            || self.operator == ''Eq'' || self.operator == ''Ne'')
                            ? (has(self.values) && size(self.values) == 1) : true'
                      maxItems: 10
                      type: array
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: A list of label key-value pairs that a cluster
                        must have to match this selector term.
                      maxProperties: 10
                      type: object
                  type: object
                type: array
                x-kubernetes-validations:
                - message: the clusterSelectorTerms field is immutable
                  rule: self == oldSelf
              placementPolicyRef:
                description: |-
                  The reference to the placement policy that submits the cluster request.

                  This field is immutable after creation.
                properties:
                  apiGroup:
                    type: string
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    description: The name of the referenced object.
                    type: string
                  namespace:
                    description: |-
                      The namespace of the referenced object.

                      If the object is cluster-scoped, this field should be left empty.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: the placementPolicyRef field is immutable
                  rule: self == oldSelf
            required:
            - placementPolicyRef
            type: object
          status:
            description: The observed status of the cluster request.
            properties:
              conditions:
                description: A list of observed conditions of the cluster request.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastObservedMostRecentClusterCreationTimestamp:
                description: |-
                  The last observed most recent creation timestamp across all the member clusters. This field is used
                  as an expedient solution to verify if a cluster request is still valid for consideration, i.e.,
                  if the currently observed most recent cluster creation timestamp is later than this timestamp in the
                  status, a new member cluster must have been created after the cluster request was created,
                  and thus the cluster request should be considered stale and can be ignored. The placement policy
                  that submits the cluster request is responsible for updating this field if the new cluster does not
                  meet the need of the associated cluster selector, so that the cluster request can be re-evaluated again;
                  it may instead withdraw the cluster request if the new cluster has fulfilled the associated cluster selector.
                format: date-time
                type: string
              provisionedClusterName:
                description: The name of the cluster that has been provisioned for
                  this cluster request, if any.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
